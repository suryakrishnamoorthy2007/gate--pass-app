<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - College Gate Pass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center px-6">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-id-card-clip text-2xl text-indigo-400"></i>
            <h1 class="text-xl font-bold tracking-wide">College Gate Pass Portal</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="clearAllPasses()" class="bg-red-600 hover:bg-red-700 text-white text-sm px-3 py-1.5 rounded-lg shadow font-medium">
                <i class="fa-solid fa-trash-can mr-1"></i> Clear All Data
            </button>
            <button onclick="loadPasses()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-sm px-3 py-1.5 rounded-lg shadow font-medium">
                <i class="fa-solid fa-arrows-rotate mr-1"></i> Refresh Table
            </button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <div class="lg:col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b flex items-center">
                <i class="fa-solid fa-user-plus text-indigo-600 mr-2"></i> Issue New Pass
            </h2>
            <form onsubmit="handleIssuePass(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Roll Number</label>
                    <input type="text" id="rollNo" required placeholder="e.g. 110324104107" class="w-full mt-1 p-2 border rounded-lg text-sm uppercase focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Student Name</label>
                    <input type="text" id="name" required placeholder="e.g. Surya K" class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Dept</label>
                        <select id="dept" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none">
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                            <option value="IT">IT</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Year</label>
                        <select id="year" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none">
                            <option value="I">I</option>
                            <option value="II">II</option>
                            <option value="III" selected>III</option>
                            <option value="IV">IV</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Sec</label>
                        <select id="section" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Destination / Address</label>
                    <input type="text" id="address" placeholder="e.g. Anna Nagar, Chennai" value="Anna Nagar, Chennai" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Reason</label>
                    <input type="text" id="reason" placeholder="e.g. Home Visit / Project" value="Home Visit" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none">
                </div>
                <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition shadow">
                    Approve Pass
                </button>
            </form>
        </div>

        <div class="lg:col-span-3 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h2 class="text-lg font-bold text-gray-800 flex items-center">
                    <i class="fa-solid fa-list-check text-indigo-600 mr-2"></i> Live Pass Logs (IST)
                </h2>
                <span id="passCount" class="text-xs bg-indigo-100 text-indigo-800 font-semibold px-2.5 py-1 rounded-full">0 Records</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs border-b">
                            <th class="py-3 px-3">Roll No</th>
                            <th class="py-3 px-3">Student Name</th>
                            <th class="py-3 px-2">Dept</th>
                            <th class="py-3 px-2">Year</th>
                            <th class="py-3 px-2">Sec</th>
                            <th class="py-3 px-3">Status</th>
                            <th class="py-3 px-3">Approved (IST)</th>
                            <th class="py-3 px-3">Valid Until</th>
                            <th class="py-3 px-3">Exited (IST)</th>
                            <th class="py-3 px-2 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="10" class="py-6 text-center text-gray-400">Loading student records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function loadPasses() {
            try {
                const res = await fetch('/api/passes');
                const data = await res.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                if (data.success && data.data.length > 0) {
                    document.getElementById('passCount').innerText = `${data.data.length} Passes`;
                    data.data.forEach(pass => {
                        const statusBadge = pass.status === 'Exited' 
                            ? '<span class="px-2.5 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-md"><i class="fa-solid fa-check mr-1"></i>Exited</span>'
                            : '<span class="px-2.5 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-md"><i class="fa-solid fa-clock mr-1"></i>Approved</span>';

                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="py-3 px-3 font-bold text-indigo-950">${pass.rollNo}</td>
                                <td class="py-3 px-3 font-medium text-gray-800">${pass.name}</td>
                                <td class="py-3 px-2 text-gray-600">${pass.dept || '-'}</td>
                                <td class="py-3 px-2 text-gray-700 font-semibold">${pass.year || '-'}</td>
                                <td class="py-3 px-2 text-gray-700 font-semibold">${pass.section || '-'}</td>
                                <td class="py-3 px-3">${statusBadge}</td>
                                <td class="py-3 px-3 text-xs text-gray-600">${pass.approvedAt || '-'}</td>
                                <td class="py-3 px-3 text-xs text-gray-500">${pass.validUntil || '-'}</td>
                                <td class="py-3 px-3 text-xs font-semibold text-green-700">${pass.exitTime || '-'}</td>
                                <td class="py-3 px-2 text-center">
                                    <button onclick="deletePass('${pass._id}')" class="text-gray-400 hover:text-red-600 transition p-1" title="Delete pass">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    document.getElementById('passCount').innerText = `0 Passes`;
                    tbody.innerHTML = `<tr><td colspan="10" class="py-6 text-center text-gray-400">No pass records created yet.</td></tr>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function handleIssuePass(e) {
            e.preventDefault();
            const payload = {
                rollNo: document.getElementById('rollNo').value.trim(),
                name: document.getElementById('name').value.trim(),
                dept: document.getElementById('dept').value,
                year: document.getElementById('year').value,
                section: document.getElementById('section').value,
                address: document.getElementById('address').value.trim(),
                reason: document.getElementById('reason').value.trim()
            };

            const res = await fetch('/api/pass/issue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('rollNo').value = '';
                document.getElementById('name').value = '';
                loadPasses();
            } else {
                alert(data.message || 'Failed to issue pass.');
            }
        }

        async function deletePass(id) {
            if (!confirm('Are you sure you want to delete this pass record?')) return;
            const res = await fetch(`/api/pass/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) loadPasses();
        }

        async function clearAllPasses() {
            if (!confirm('WARNING: This will delete ALL passes in the database. Continue?')) return;
            const res = await fetch('/api/passes/clear-all', { method: 'DELETE' });
            const data = await res.json();
            if (data.success) loadPasses();
        }

        // Auto load on start and refresh every 10 seconds
        loadPasses();
        setInterval(loadPasses, 10000);
    </script>
</body>
</html>
