<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Security Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-md text-center py-2">
        <h1 class="text-xl font-bold tracking-wide text-indigo-400">
            <i class="fa-solid fa-shield-halved mr-2"></i>Campus Gate Security
        </h1>
        <p class="text-xs text-slate-400 mt-1">Scan Student ID Card or Enter Roll No</p>
    </div>

    <div class="w-full max-w-md bg-slate-800 p-4 rounded-3xl shadow-xl border border-slate-700 flex flex-col items-center">
        
        <div id="reader" class="w-full rounded-2xl overflow-hidden bg-black aspect-square border-2 border-dashed border-slate-600"></div>

        <form onsubmit="handleManualScan(event)" class="w-full mt-4 flex gap-2">
            <input type="text" id="manualRoll" placeholder="Type Roll No..." class="flex-1 bg-slate-900 border border-slate-700 text-white px-3 py-2 rounded-xl text-sm outline-none focus:border-indigo-500 uppercase">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-xl text-sm font-semibold transition">
                Verify
            </button>
        </form>
    </div>

    <div id="resultCard" class="hidden w-full max-w-md bg-slate-800 border-2 border-green-500 p-5 rounded-2xl shadow-2xl mt-4">
        <div class="flex items-center space-x-3 mb-3">
            <div class="w-10 h-10 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center text-xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div>
                <h3 class="font-bold text-base text-green-400">EXIT APPROVED</h3>
                <p id="exitTimeDisplay" class="text-xs text-slate-400"></p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900 p-3 rounded-xl border border-slate-700">
            <div><span class="text-slate-500">Roll No:</span> <b id="resRoll" class="text-white"></b></div>
            <div><span class="text-slate-500">Name:</span> <b id="resName" class="text-white"></b></div>
            <div><span class="text-slate-500">Dept:</span> <b id="resDept" class="text-white"></b></div>
            <div><span class="text-slate-500">Year / Sec:</span> <b id="resYearSec" class="text-white"></b></div>
        </div>

        <button onclick="dismissResult()" class="w-full mt-3 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-xs font-semibold">
            Scan Next Student
        </button>
    </div>

    <p class="text-xs text-slate-500 my-2">Indian Standard Time (IST) Active</p>

    <script>
        let isProcessing = false;

        async function verifyStudent(rollNo) {
            if (isProcessing) return;
            isProcessing = true;

            try {
                const res = await fetch('/api/pass/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNo: rollNo.trim() })
                });
                const result = await res.json();

                if (result.success) {
                    const pass = result.data;
                    document.getElementById('resRoll').innerText = pass.rollNo;
                    document.getElementById('resName').innerText = pass.name;
                    document.getElementById('resDept').innerText = pass.dept;
                    document.getElementById('resYearSec').innerText = `${pass.year} Year / '${pass.section}' Sec`;
                    document.getElementById('exitTimeDisplay').innerText = `Exited At: ${pass.exitTime} (IST)`;
                    document.getElementById('resultCard').classList.remove('hidden');
                } else {
                    alert(result.message || 'No approved pass found!');
                    isProcessing = false;
                }
            } catch (err) {
                alert('Connection error with server.');
                isProcessing = false;
            }
        }

        function dismissResult() {
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('manualRoll').value = '';
            isProcessing = false;
        }

        function handleManualScan(e) {
            e.preventDefault();
            const roll = document.getElementById('manualRoll').value;
            if (roll) verifyStudent(roll);
        }

        // Start Camera Barcode/QR Scanner
        function onScanSuccess(decodedText) {
            if (!isProcessing) {
                verifyStudent(decodedText);
            }
        }

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: { width: 250, height: 250 } 
        });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
