<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Gate Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 font-sans p-4 flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-full text-xl mb-1">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="text-xl font-bold text-white tracking-wide">Main Gate Security Scanner</h1>
      <p class="text-xs text-slate-400">Scan student barcode/ID card to verify exit clearance</p>
    </div>

    <!-- Camera Scanner Box -->
    <div class="relative overflow-hidden rounded-2xl bg-black border-2 border-slate-600 aspect-square flex items-center justify-center">
      <div id="reader" class="w-full h-full"></div>
    </div>

    <!-- Manual Entry Form -->
    <form onsubmit="handleManualScan(event)" class="space-y-3">
      <div class="flex gap-2">
        <input 
          type="text" 
          id="manualRollInput" 
          placeholder="Or enter Roll / Barcode manually" 
          class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono uppercase"
        />
        <button 
          type="submit" 
          class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow"
        >
          Verify
        </button>
      </div>
    </form>

    <!-- Scan Result Card -->
    <div id="resultBox" class="hidden rounded-2xl p-5 border text-center space-y-3 transition-all duration-300">
      <div id="statusIcon" class="text-3xl"></div>
      <div>
        <h3 id="statusTitle" class="text-base font-bold"></h3>
        <p id="statusDesc" class="text-xs text-slate-300 mt-1"></p>
      </div>

      <!-- Verified Student Info Details -->
      <div id="studentDetails" class="hidden bg-slate-900/60 rounded-xl p-3 text-left text-xs space-y-1 border border-slate-700/50">
        <div class="flex justify-between"><span class="text-slate-400">Student:</span> <span id="resName" class="font-semibold text-white"></span></div>
        <div class="flex justify-between"><span class="text-slate-400">Roll No:</span> <span id="resRoll" class="font-mono text-emerald-400 font-bold"></span></div>
        <div class="flex justify-between"><span class="text-slate-400">Department:</span> <span id="resDept" class="text-slate-200"></span></div>
        <div class="flex justify-between"><span class="text-slate-400">Exit Time:</span> <span id="resTime" class="font-mono text-emerald-400"></span></div>
      </div>

      <!-- Free Direct WhatsApp Parent Alert Button -->
      <button 
        id="whatsappBtn" 
        onclick="triggerWhatsAppMessage()" 
        class="hidden w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition shadow flex items-center justify-center gap-2"
      >
        <i class="fa-brands fa-whatsapp text-lg"></i>
        <span>Send WhatsApp Alert to Parent</span>
      </button>
    </div>

  </div>

  <script>
    let activeExitData = null;

    async function verifyPass(rollNo) {
      if (!rollNo) return;
      const cleanRoll = rollNo.trim();

      const resultBox = document.getElementById('resultBox');
      const statusIcon = document.getElementById('statusIcon');
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');
      const studentDetails = document.getElementById('studentDetails');
      const whatsappBtn = document.getElementById('whatsappBtn');

      resultBox.classList.remove('hidden');

      try {
        const res = await fetch('/api/scan-pass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rollNo: cleanRoll })
        });

        const data = await res.json();

        if (data.success && data.pass) {
          const pass = data.pass;
          activeExitData = pass;

          resultBox.className = "rounded-2xl p-5 border text-center space-y-3 bg-emerald-950/40 border-emerald-500/40 text-emerald-200";
          statusIcon.innerHTML = "✅";
          statusTitle.textContent = "GATE EXIT APPROVED";
          statusDesc.textContent = "Pass status updated to Exited.";

          document.getElementById('resName').textContent = pass.name;
          document.getElementById('resRoll').textContent = pass.rollNo;
          document.getElementById('resDept').textContent = `${pass.dept || 'Engineering'} (${pass.year || ''} - ${pass.sec || ''})`;
          document.getElementById('resTime').textContent = pass.exitTime;

          studentDetails.classList.remove('hidden');
          whatsappBtn.classList.remove('hidden');
        } else {
          activeExitData = null;
          resultBox.className = "rounded-2xl p-5 border text-center space-y-3 bg-red-950/40 border-red-500/40 text-red-200";
          statusIcon.innerHTML = "❌";
          statusTitle.textContent = "EXIT DENIED";
          statusDesc.textContent = data.message || "No approved pass found for this student.";
          
          studentDetails.classList.add('hidden');
          whatsappBtn.classList.add('hidden');
        }
      } catch (err) {
        resultBox.className = "rounded-2xl p-5 border text-center space-y-3 bg-amber-950/40 border-amber-500/40 text-amber-200";
        statusIcon.innerHTML = "⚠️";
        statusTitle.textContent = "CONNECTION ERROR";
        statusDesc.textContent = "Could not connect to server.";
        studentDetails.classList.add('hidden');
        whatsappBtn.classList.add('hidden');
      }
    }

    function triggerWhatsAppMessage() {
      if (!activeExitData) return;

      const parentPhone = activeExitData.parentContact || activeExitData.mobile || '';
      const cleanPhone = parentPhone.replace(/[^0-9]/g, '');

      if (!cleanPhone || cleanPhone.length < 10) {
        alert("No parent phone number found for this student.");
        return;
      }

      const messageText = 
`🚨 *CAMPUS GATE EXIT NOTIFICATION*

Dear Parent / Guardian,
Your ward *${activeExitData.name}* (Roll No: *${activeExitData.rollNo}*, ${activeExitData.dept || 'Engineering'}) has officially cleared and exited the college main gate.

⏱️ *Exit Timestamp:* ${activeExitData.exitTime} (IST)
🔒 *Gate Status:* Verified & Exited ✅

_College Security & Administration Office_`;

      const targetNumber = cleanPhone.length === 10 ? `91${cleanPhone}` : cleanPhone;
      const whatsappUrl = `https://wa.me/${targetNumber}?text=${encodeURIComponent(messageText)}`;

      window.open(whatsappUrl, '_blank');
    }

    function handleManualScan(e) {
      e.preventDefault();
      const input = document.getElementById('manualRollInput');
      verifyPass(input.value);
      input.value = '';
    }

    function initScanner() {
      const html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          verifyPass(decodedText);
        },
        (errorMessage) => {}
      ).catch(err => {
        console.warn("Camera access denied or unavailable:", err);
      });
    }

    document.addEventListener('DOMContentLoaded', initScanner);
  </script>
</body>
</html>
